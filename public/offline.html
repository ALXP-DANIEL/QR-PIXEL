<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Pixel Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #0a0a0a;
        color: #f5f5f5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgb(255 255 255 / 16%);
        padding: 24px;
        background: rgb(255 255 255 / 6%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      p {
        margin: 0;
        color: rgb(245 245 245 / 72%);
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QR Pixel is offline</h1>
      <p>Open QR Pixel once while online, then the generator shell is available from your device cache.</p>
    </main>
  </body>
</html>
